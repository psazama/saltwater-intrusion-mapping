# Curated environment for saltwater-intrusion-mapping.
#
# The conda layer only provides Python plus the geospatial binary stack
# (GDAL/GEOS/PROJ via rasterio & geopandas). All Python-level dependencies are
# single-sourced from pyproject.toml via the editable pip install below, so
# this file must be created from the repository root:
#
#     conda env create -f environment.yml
#     conda activate saltmapping
#
# Drop extras you don't need (e.g. [ml] on a machine without a GPU).
name: saltmapping
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Geospatial binaries from conda-forge (avoids source builds of GDAL etc.)
  - gdal
  - geopandas
  - rasterio
  - pyproj
  # Optional interactive tooling - comment out for slim/CI environments
  - jupyterlab
  - pip:
      - -e .[ml,api,gcp,dev]
