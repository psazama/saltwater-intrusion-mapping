[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swmaps"
version = "0.1.2"
description = "Configuration-driven satellite imagery pipeline for mapping saltwater intrusion and coastal land cover change."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "dask",
    "earthengine-api",
    "geemap",
    "geopandas",
    "matplotlib",
    "numba",
    "numpy",
    "pandas",
    "pillow",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "rasterio",
    "requests",
    "rioxarray",
    "scipy",
    "shapely",
    "tqdm",
    "xarray",
]

[project.optional-dependencies]
# Deep-learning training/inference stack (FarSeg, Panopticon, SAM)
ml = [
    "albumentations",
    "cloudml-hypertune",
    "scikit-learn",
    "segmentation_models_pytorch",
    "torch",
    "torchgeo",
]
# FastAPI service + TiTiler proxy
api = [
    "fastapi",
    "httpx",
    "uvicorn",
]
# Cloud Run trigger, Pub/Sub publishing, GCS storage helpers
gcp = [
    "flask",
    "google-cloud-pubsub",
    "google-cloud-run",
    "google-cloud-storage",
]
dev = [
    "black",
    "isort",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
# Only ship the swmaps package - the bare find previously also picked up
# tests/ (it has an __init__.py) and installed it as a top-level package.
include = ["swmaps*"]
