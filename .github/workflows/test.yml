name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        # Deps are single-sourced from pyproject.toml. The [ml] extra (torch
        # et al.) is intentionally omitted: no test imports it, and skipping
        # it keeps CI fast.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Run tests
        run: pytest -q
