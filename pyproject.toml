[project]
name = "swmaps"
version = "0.1.2"
dependencies = [
    "dask",
    "earthengine-api",
    "geemap",
    "geopandas",
    "matplotlib",
    "numba",
    "numpy",
    "pandas",
    "pillow",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "rasterio",
    "requests",
    "rioxarray",
    "scipy",
    "shapely",
    "tqdm",
    "xarray",
]

[project.optional-dependencies]
# Deep-learning training/inference stack (FarSeg, Panopticon, SAM)
ml = [
    "albumentations",
    "cloudml-hypertune",
    "scikit-learn",
    "segmentation_models_pytorch",
    "torch",
    "torchgeo",
]
# FastAPI service + TiTiler proxy
api = [
    "fastapi",
    "httpx",
    "uvicorn",
]
# Cloud Run trigger, Pub/Sub publishing, GCS storage helpers
gcp = [
    "flask",
    "google-cloud-pubsub",
    "google-cloud-run",
    "google-cloud-storage",
]
dev = [
    "black",
    "isort",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = { find = {} }
