services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    volumes:
      - /data/swmaps:/app/data  # mount external data volume
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn swmaps.api:app --host 0.0.0.0 --port 8000 --workers 2
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    volumes:
      - /data/swmaps:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    environment:
      - WORKERS_PER_CORE=2
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - /data/swmaps:/data
    restart: unless-stopped
